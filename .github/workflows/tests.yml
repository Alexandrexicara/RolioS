name: RollOS tests
on:
  push:
    branches: [main, feature/rollos-desktop-prototype]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run service tests
        run: python -m unittest discover -s tests -v
