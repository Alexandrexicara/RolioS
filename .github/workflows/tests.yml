name: RollOS tests

on:
  push:
    branches:
      - main
      - feature/rollos-integrated-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: Testes em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validar sintaxe Python
        run: python -m compileall -q rollos tests main.py
      - name: Executar testes dos serviços
        run: python -m unittest discover -s tests -v
