<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131d"><meta name="description" content="Tela inicial do RollOS"><title>RollOS — Início</title><style>
:root{color-scheme:dark;--bg:#07131d;--panel:#102532;--mint:#79ead5;--muted:#a4b7c4;--line:#284553}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#16434b 0,#0a1c29 42%,#07131d 100%);color:#f2fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.phone-home{max-width:520px;min-height:100vh;margin:auto;padding:26px 22px 34px;display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;font-size:13px;color:#d5e8ed}.clock{text-align:center;margin:58px 0 42px}.clock strong{display:block;font-size:64px;line-height:1.1;letter-spacing:-3px}.clock span{color:#c0d5dc;font-size:15px}.welcome{font-size:12px;letter-spacing:2px;color:var(--mint);text-align:center}.launcher-title{text-align:center;font-size:23px;margin:8px 0 24px}.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}.app{border:1px solid #ffffff18;background:#ffffff0b;border-radius:20px;min-height:112px;color:white;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 5px;transition:.18s}.app:active,.app:hover{background:#ffffff19;transform:scale(.97)}.app-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#2b6770,#153542);font-size:27px;box-shadow:0 8px 22px #0003}.app b{font-size:12px;font-weight:600}.section{margin:30px 0 12px;color:#a9c1cb;font-size:11px;letter-spacing:1.6px}.dock{margin-top:auto;padding-top:34px}.dock-items{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:13px;background:#d8f7f21b;border:1px solid #ffffff20;border-radius:25px;backdrop-filter:blur(18px)}.dock .app{min-height:75px;border:0;background:transparent;padding:4px}.dock .app-icon{width:48px;height:48px}.home-indicator{width:112px;height:4px;background:#d8e8eb;border-radius:9px;margin:24px auto 0;opacity:.75}.hint{text-align:center;color:#8ca6b2;font-size:11px;margin:18px 0 0;line-height:1.5}@media(min-width:700px){.phone-home{min-height:900px;max-height:1000px;border:1px solid #ffffff18;border-radius:34px;margin:28px auto;box-shadow:0 25px 100px #0008}.clock{margin-top:65px}}
</style></head>
<body><main class="phone-home"><div class="status"><span id="status-time">--:--</span><span>◉　Wi-Fi　▰</span></div><header class="clock"><strong id="clock">--:--</strong><span id="date"></span></header><div class="welcome">SEU MUNDO. SUA TELA.</div><h1 class="launcher-title">Bem-vindo ao RollOS</h1>
<div class="section">APLICATIVOS DO SISTEMA</div><nav class="app-grid" aria-label="Aplicativos">
<a class="app" href="/home-os.html"><span class="app-icon">⌂</span><b>Home OS</b></a>
<a class="app" href="/rollos.html"><span class="app-icon">R</span><b>Página RollOS</b></a>
<a class="app" href="/home-os.html#ai"><span class="app-icon">🤖</span><b>Jarvis</b></a>
<a class="app" href="/home-os.html#display"><span class="app-icon">▣</span><b>Tela adaptável</b></a>
<a class="app" href="/home-os.html#storage"><span class="app-icon">▤</span><b>Armazenamento</b></a>
<a class="app" href="/home-os.html#apps"><span class="app-icon">▦</span><b>Aplicativos</b></a>
</nav><div class="dock"><div class="section">ATALHOS</div><div class="dock-items">
<a class="app" href="/home-os.html#ai"><span class="app-icon">✳</span><b>Jarvis</b></a>
<a class="app" href="/home-os.html#apps"><span class="app-icon">▦</span><b>Loja</b></a>
<a class="app" href="/home-os.html#storage"><span class="app-icon">☁</span><b>Nuvem</b></a>
<a class="app" href="/rollos.html"><span class="app-icon">R</span><b>RollOS</b></a>
</div><div class="home-indicator"></div><p class="hint">Tela inicial experimental do RollOS. Os módulos existentes continuam disponíveis em Home OS.</p></div></main>
<script>function updateClock(){const d=new Date();const time=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.getElementById('clock').textContent=time;document.getElementById('status-time').textContent=time;document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}updateClock();setInterval(updateClock,15000);</script></body></html>
